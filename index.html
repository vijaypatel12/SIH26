<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IP-SAKTI Sahayak — SIH 2026 · PS 26045 </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --navy: #123c7c;
      --navy2: #0c2c5e;
      --ink: #182b49;
      --muted: #5a6b85;
      --bg: #f2f5fa;
      --card: #fff;
      --line: #d9e1ee;
      --line2: #edf1f8;
      --blue: #1c4fa1;
      --bluet: #e8eefb;
      --saffron: #e07c1c;
      --saffronT: #fdf1df;
      --saffronD: #96570a;
      --green: #177a4b;
      --greenT: #e2f4ea;
      --sh: 0 1px 2px rgba(15, 35, 72, .06), 0 4px 16px rgba(15, 35, 72, .05);
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: 'Mukta', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.55
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: 'Anek Devanagari', 'Mukta', sans-serif;
      line-height: 1.25
    }

    button {
      font-family: inherit
    }

    .icon {
      width: 20px;
      height: 20px;
      flex: none
    }

    .icon.lg {
      width: 24px;
      height: 24px
    }

    .icon.xl {
      width: 30px;
      height: 30px
    }

    /* tricolor strip */
    .strip {
      display: flex;
      height: 5px
    }

    .strip span {
      flex: 1
    }

    .strip span:nth-child(1) {
      background: #f08a1d
    }

    .strip span:nth-child(2) {
      background: #eef2f8;
      border-top: 1px solid #c9d4e8
    }

    .strip span:nth-child(3) {
      background: #1a7f4e
    }

    /* header */
    .hdr {
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 40
    }

    .hdr-in {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      flex-wrap: wrap
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      margin-right: auto
    }

    .logo {
      width: 46px;
      height: 46px;
      color: var(--navy);
      flex: none
    }

    .brand-t {
      font-size: 21px;
      font-weight: 800;
      color: var(--navy2);
      letter-spacing: .2px
    }

    .brand-s {
      font-size: 12.5px;
      color: var(--muted);
      font-weight: 500
    }

    .hdr-ctl {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .seg {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 9px;
      overflow: hidden;
      background: #fff
    }

    .seg button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border: none;
      background: none;
      cursor: pointer;
      font: 600 13.5px 'Anek Devanagari';
      color: var(--muted)
    }

    .seg button.on {
      background: var(--navy);
      color: #fff
    }

    .seg button+button {
      border-left: 1px solid var(--line)
    }

    .b-Pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--saffronT);
      border: 1px solid #f2c98c;
      color: var(--saffronD);
      border-radius: 999px;
      padding: 6px 13px;
      font: 700 12.5px 'Anek Devanagari';
      letter-spacing: .6px
    }

    /* layout */
    .layout {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      gap: 26px;
      padding: 24px 20px 40px;
      align-items: flex-start
    }

    .side {
      width: 236px;
      flex: none;
      position: sticky;
      top: 86px
    }

    .view {
      flex: 1;
      min-width: 0
    }

    @media(max-width:980px) {
      .layout {
        flex-direction: column
      }

      .side {
        width: 100%;
        position: static
      }

      .nav {
        display: flex !important;
        overflow-x: auto;
        gap: 8px;
        padding-bottom: 6px
      }

      .nav-item {
        flex: none
      }

      .side-card,
      .side-ft {
        display: none
      }
    }

    /* sidebar */
    .side-lbl {
      font: 700 11.5px 'Anek Devanagari';
      letter-spacing: 1.2px;
      color: var(--muted);
      text-transform: uppercase;
      margin: 0 0 8px 4px
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: none;
      cursor: pointer;
      text-align: left;
      font: 500 14.5px 'Mukta';
      color: var(--ink);
      width: 100%
    }

    .nav-item:hover {
      background: #e9eef7
    }

    .nav-item.on {
      background: #fff;
      border-color: var(--line);
      box-shadow: var(--sh);
      color: var(--navy2);
      font-weight: 700
    }

    .nav-item.on::before {
      content: '';
      position: absolute;
      left: 0;
      width: 3px;
      height: 60%;
      background: var(--saffron);
      border-radius: 2px
    }

    .nav-item {
      position: relative
    }

    .nstep {
      width: 22px;
      height: 22px;
      flex: none;
      border-radius: 6px;
      background: var(--line2);
      color: var(--muted);
      display: grid;
      place-items: center;
      font: 700 11.5px 'Anek Devanagari'
    }

    .nav-item.on .nstep {
      background: var(--navy);
      color: #fff
    }

    .side-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-top: 18px;
      box-shadow: var(--sh)
    }

    .mini-t {
      font: 700 13px 'Anek Devanagari';
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .mini-bar {
      height: 7px;
      border-radius: 99px;
      background: var(--line2);
      margin-top: 9px;
      overflow: hidden
    }

    .mini-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 99px;
      transition: width .3s
    }

    .mini-fill.full {
      background: var(--green)
    }

    .side-ft {
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
      padding-left: 4px
    }

    /* page head */
    .pagehead {
      margin-bottom: 18px
    }

    .crumb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font: 600 12.5px 'Anek Devanagari';
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 10px
    }

    .crumb b {
      color: var(--saffronD)
    }

    .pagehead h1 {
      font-size: 27px;
      color: var(--navy2)
    }

    .pagehead .sub {
      color: var(--muted);
      margin-top: 3px;
      max-width: 760px
    }

    /* hero */
    .hero {
      background: var(--navy2);
      color: #fff;
      border-radius: 16px;
      padding: 34px 32px 30px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--sh)
    }

    .hero-em {
      position: absolute;
      right: -30px;
      top: -34px;
      width: 250px;
      height: 250px;
      color: #fff;
      opacity: .08;
      pointer-events: none
    }

    .kick {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: 700 12px 'Anek Devanagari';
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #ffcf9a;
      border: 1px solid rgba(255, 207, 154, .4);
      border-radius: 999px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, .05)
    }

    .hero h1 {
      font-size: 31px;
      margin: 14px 0 8px;
      max-width: 640px
    }

    .hero .hsub {
      color: #c6d4ec;
      max-width: 620px;
      font-size: 16.5px
    }

    .juris-line {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
      font-size: 13.5px;
      color: #aebfe0;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      padding: 4px 13px
    }

    .searchrow {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      max-width: 680px;
      position: relative;
      z-index: 1
    }

    .hsearch {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 14px 16px;
      font: 500 15.5px 'Mukta';
      color: var(--ink);
      outline: 3px solid transparent
    }

    .hsearch:focus {
      outline: 3px solid rgba(224, 124, 28, .55)
    }

    @media(max-width:640px) {
      .searchrow {
        flex-direction: column
      }

      .hero {
        padding: 26px 22px
      }
    }

    /* cards & grids */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: var(--sh)
    }

    .card+.card {
      margin-top: 16px
    }

    .card-t {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17.5px;
      color: var(--navy2);
      margin-bottom: 10px
    }

    .card-t .icon {
      color: var(--saffron)
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px
    }

    @media(max-width:760px) {
      .grid2 {
        grid-template-columns: 1fr
      }
    }

    .sec-gap {
      margin-top: 18px
    }

    /* buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 17px;
      border-radius: 9px;
      border: 1px solid transparent;
      font: 600 15px 'Anek Devanagari';
      cursor: pointer;
      transition: .15s;
      background: none;
      color: var(--ink)
    }

    .btn-p {
      background: var(--blue);
      color: #fff
    }

    .btn-p:hover {
      background: var(--navy)
    }

    .btn-a {
      background: var(--saffron);
      color: #fff
    }

    .btn-a:hover {
      background: #c66a10
    }

    .btn-o {
      border-color: var(--line);
      background: #fff;
      color: var(--blue)
    }

    .btn-o:hover {
      border-color: var(--blue);
      background: var(--bluet)
    }

    .btn-s {
      color: var(--muted)
    }

    .btn-s:hover {
      background: #e7ecf4;
      color: var(--ink)
    }

    .btn-g {
      background: var(--green);
      color: #fff
    }

    .btn-g:hover {
      background: #116040
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    /* badges & chips */
    .b {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font: 700 11.5px 'Anek Devanagari';
      letter-spacing: .5px;
      text-transform: uppercase;
      white-space: nowrap
    }

    .b- {
      background: var(--saffronT);
      color: var(--saffronD);
      border: 1px solid #f2c98c
    }

    .b-ok {
      background: var(--greenT);
      color: var(--green);
      border: 1px solid #b3dcc5
    }

    .b-warn {
      background: #fdf3e1;
      color: #96650a;
      border: 1px solid #ecd39d
    }

    .b-info {
      background: var(--bluet);
      color: var(--blue);
      border: 1px solid #c4d4f2
    }

    .b-mut {
      background: #eef1f6;
      color: #5a6b85;
      border: 1px solid #dbe1ec
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--line2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 11px;
      font: 500 13px 'Mukta';
      color: #3c4f70
    }

    button.chip {
      cursor: pointer
    }

    button.chip:hover {
      border-color: var(--blue);
      color: var(--blue)
    }

    .chiprow {
      display: flex;
      flex-wrap: wrap;
      gap: 7px
    }

    /* notices */
    .notice {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 14.5px;
      border: 1px solid
    }

    .notice .icon {
      margin-top: 2px;
      color: inherit
    }

    .n-warn {
      background: var(--saffronT);
      border-color: #f0cc90;
      color: #7a4a08
    }

    .n-blue {
      background: var(--bluet);
      border-color: #c4d4f2;
      color: #1d3f77
    }

    .n-green {
      background: var(--greenT);
      border-color: #b3dcc5;
      color: #11563a
    }

    /* quick actions */
    .qa-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      text-align: left;
      box-shadow: var(--sh);
      transition: .15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: inherit
    }

    .qa-card:hover {
      border-color: var(--blue);
      transform: translateY(-2px)
    }

    .qa-ic {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--bluet);
      color: var(--blue);
      display: grid;
      place-items: center
    }

    .qa-card h3 {
      font-size: 16.5px;
      color: var(--navy2)
    }

    .qa-card p {
      font-size: 13.5px;
      color: var(--muted);
      flex: 1
    }

    .qa-go {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 700 13px 'Anek Devanagari';
      color: var(--saffronD)
    }

    /* stepper */
    .stepper {
      display: flex;
      align-items: center;
      gap: 2px;
      overflow-x: auto;
      padding: 4px 2px 10px
    }

    .st-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 7px 13px 7px 8px;
      cursor: pointer;
      font: 600 13.5px 'Anek Devanagari';
      color: var(--ink);
      white-space: nowrap;
      flex: none
    }

    .st-item:hover {
      border-color: var(--blue)
    }

    .st-item.on {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff
    }

    .st-item .nstep {
      background: var(--line2);
      color: var(--muted)
    }

    .st-item.on .nstep {
      background: #fff;
      color: var(--navy)
    }

    .st-sep {
      color: #a9b7cf;
      flex: none
    }

    /* ask page */
    .querybox {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 12px 14px;
      font: 500 15.5px 'Mukta';
      color: var(--ink);
      width: 100%;
      min-height: 74px;
      resize: vertical;
      background: #fbfcfe
    }

    .querybox:focus {
      outline: 2px solid var(--blue);
      background: #fff
    }

    .think {
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .think div {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 15px
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--saffron);
      flex: none;
      animation: pulse 1s infinite
    }

    @keyframes pulse {
      50% {
        opacity: .25
      }
    }

    .flow {
      margin-top: 14px
    }

    .flow-item {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 14px;
      position: relative;
      padding-bottom: 20px
    }

    .flow-item:last-child {
      padding-bottom: 0
    }

    .flow-item::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 46px;
      bottom: 2px;
      width: 2px;
      background: var(--line)
    }

    .flow-item:last-child::before {
      display: none
    }

    .fnode {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      display: grid;
      place-items: center;
      font: 700 16px 'Anek Devanagari';
      box-shadow: var(--sh)
    }

    .fnode.alt {
      background: #fff;
      color: var(--navy);
      border: 2px solid var(--navy)
    }

    .ans-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 4px
    }

    .ans-head h2 {
      font-size: 21px;
      color: var(--navy2);
      margin-right: auto
    }

    .qlist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .qlist li {
      display: flex;
      gap: 12px;
      align-items: flex-start
    }

    .qnum {
      width: 26px;
      height: 26px;
      flex: none;
      border-radius: 8px;
      background: var(--bluet);
      color: var(--blue);
      display: grid;
      place-items: center;
      font: 700 13px 'Anek Devanagari';
      margin-top: 1px
    }

    .qlist .lnk {
      background: none;
      border: none;
      color: var(--blue);
      font: 600 14.5px 'Mukta';
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 0
    }

    .qlist .lnk:hover {
      color: var(--navy2)
    }

    /* wizard */
    .wiz-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    .wiz-q {
      font-size: 19px;
      font-weight: 600;
      color: var(--navy2);
      margin: 8px 0 16px
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1.5px solid var(--line);
      border-radius: 11px;
      padding: 13px 16px;
      cursor: pointer;
      font: 500 15.5px 'Mukta';
      transition: .12s;
      margin-bottom: 9px
    }

    .opt:hover {
      border-color: var(--blue);
      background: var(--bluet)
    }

    .opt .optmark {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #b8c5dc;
      flex: none
    }

    .opt.yn {
      max-width: 380px;
      font-size: 16.5px;
      font-weight: 600
    }

    .opt.yn .optmark {
      border-radius: 6px
    }

    .prog {
      height: 8px;
      border-radius: 99px;
      background: var(--line2);
      overflow: hidden;
      flex: 1;
      min-width: 160px
    }

    .prog-fill {
      height: 100%;
      background: var(--blue);
      border-radius: 99px;
      transition: width .25s
    }

    .res-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--bluet);
      border: 1.5px solid #c4d4f2;
      color: var(--navy2);
      border-radius: 12px;
      padding: 12px 18px;
      font: 800 21px 'Anek Devanagari'
    }

    .kv {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 8px 14px;
      font-size: 14.5px
    }

    .kv dt {
      color: var(--muted);
      font-weight: 600
    }

    @media(max-width:560px) {
      .kv {
        grid-template-columns: 1fr
      }
    }

    /* pathway */
    .pwgrid {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 16px
    }

    .pw-card {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 15px;
      cursor: pointer;
      font: 600 14px 'Anek Devanagari';
      color: var(--ink)
    }

    .pw-card:hover {
      border-color: var(--blue)
    }

    .pw-card.on {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff
    }

    .pw-nav {
      display: flex;
      gap: 9px;
      align-items: center;
      margin-top: 16px;
      flex-wrap: wrap
    }

    .pw-count {
      font: 600 13px 'Anek Devanagari';
      color: var(--muted);
      margin-left: auto
    }

    /* prior art */
    .pa-tools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px
    }

    .inp {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 13px;
      font: 500 15px 'Mukta';
      background: #fff;
      color: var(--ink);
      width: 100%
    }

    .inp:focus {
      outline: 2px solid var(--blue)
    }

    .pa-search {
      position: relative;
      flex: 1;
      min-width: 220px
    }

    .pa-search .icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted)
    }

    .pa-search .inp {
      padding-left: 40px
    }

    .pa-card {
      position: relative;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 18px;
      cursor: pointer;
      box-shadow: var(--sh);
      transition: .15s;
      text-align: left;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .pa-card:hover {
      border-color: var(--blue);
      transform: translateY(-2px)
    }

    .pa-tag {
      position: absolute;
      top: 12px;
      right: 12px
    }

    .pa-card h3 {
      font-size: 15.5px;
      color: var(--navy2);
      padding-right: 96px;
      line-height: 1.35
    }

    .pa-card p {
      font-size: 13.5px;
      color: var(--muted)
    }

    .pa-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: auto
    }

    .pa-id {
      font: 600 12px 'Mukta';
      color: #8b98af
    }

    /* compliance */
    .ck-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 14px 6px;
      border-bottom: 1px solid var(--line2);
      cursor: pointer;
      border-radius: 8px
    }

    .ck-row:hover {
      background: #f7f9fd
    }

    .ck-row:last-child {
      border-bottom: none
    }

    .ckbox {
      width: 24px;
      height: 24px;
      flex: none;
      border-radius: 7px;
      border: 2px solid #b8c5dc;
      display: grid;
      place-items: center;
      color: #fff;
      margin-top: 2px
    }

    .ck-row.done .ckbox {
      background: var(--green);
      border-color: var(--green)
    }

    .ck-row h4 {
      font-size: 15.5px;
      color: var(--navy2)
    }

    .ck-row p {
      font-size: 13.5px;
      color: var(--muted)
    }

    .ck-row.done h4 {
      color: var(--green)
    }

    .ring {
      position: relative;
      width: 96px;
      height: 96px;
      flex: none
    }

    .ring svg {
      transform: rotate(-90deg)
    }

    .ring b {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font: 800 21px 'Anek Devanagari';
      color: var(--navy2)
    }

    /* sources */
    .src-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 19px;
      box-shadow: var(--sh);
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .src-top {
      display: flex;
      align-items: center;
      gap: 11px
    }

    .src-ic {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex: none
    }

    .src-ic.nat {
      background: var(--bluet);
      color: var(--blue)
    }

    .src-ic.intl {
      background: var(--saffronT);
      color: var(--saffronD)
    }

    .src-card h3 {
      font-size: 16px;
      color: var(--navy2)
    }

    .src-card p {
      font-size: 13.5px;
      color: var(--muted);
      flex: 1
    }

    /* facilitator */
    .field {
      margin-bottom: 14px
    }

    .lbl {
      display: block;
      font: 600 13.5px 'Anek Devanagari';
      color: var(--navy2);
      margin-bottom: 5px
    }

    .txa {
      min-height: 96px;
      resize: vertical
    }

    .hf-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 13px 6px;
      border-bottom: 1px solid var(--line2)
    }

    .hf-item:last-child {
      border-bottom: none
    }

    .hf-item h4 {
      font-size: 15px;
      color: var(--navy2)
    }

    .hf-item p {
      font-size: 13.5px;
      color: var(--muted)
    }

    .hf-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 4px
    }

    /* modal */
    .modal-ov {
      position: fixed;
      inset: 0;
      background: rgba(10, 22, 45, .55);
      display: grid;
      place-items: center;
      padding: 20px;
      z-index: 100
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      max-width: 600px;
      width: 100%;
      max-height: 88vh;
      overflow: auto;
      box-shadow: 0 20px 60px rgba(10, 22, 45, .35);
      animation: mup .18s ease
    }

    @keyframes mup {
      from {
        transform: translateY(14px);
        opacity: 0
      }
    }

    .modal-h {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 17px 22px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: #fff;
      border-radius: 16px 16px 0 0
    }

    .modal-h h3 {
      font-size: 18px;
      color: var(--navy2);
      margin-right: auto
    }

    .modal-b {
      padding: 20px 22px
    }

    .modal-f {
      padding: 15px 22px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap
    }

    /* toast */
    #toast-root {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--navy2);
      color: #fff;
      padding: 12px 18px;
      border-radius: 11px;
      box-shadow: 0 10px 30px rgba(10, 22, 45, .35);
      font: 500 14.5px 'Mukta';
      max-width: 360px;
      animation: tin .2s ease
    }

    @keyframes tin {
      from {
        transform: translateY(10px);
        opacity: 0
      }
    }

    .toast .icon {
      color: #ffc98f
    }

    /* footer */
    .ftr {
      border-top: 1px solid var(--line);
      background: #fff;
      margin-top: 20px
    }

    .ftr-in {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px
    }

    .ftr-in .logo {
      width: 30px;
      height: 30px
    }

    :focus-visible {
      outline: 2.5px solid var(--saffron);
      outline-offset: 2px;
      border-radius: 6px
    }
  </style>
</head>

    const CLS_QS = ['c_q1', 'c_q2', 'c_q3', 'c_q4', 'c_q5', 'c_q6'];

      if (cat === 'phyto') return 'phyto'; if (cat === 'newdrug') return 'newdrug';

      return 'review';

        }

     <div class="wiz-bar">
       <span class="b b-info">${fmt('q_of', { n: i + 1, m: 6 })}</span>

    function paFiltered() {
      const q = state.priorQ.trim().toLowerCase();
      return EVIDENCE.filter(e => {
        if (state.priorF !== 'all' && e.ty !== state.priorF) return false;
        if (!q) return true;
        return (e.t + ' ' + e.s + ' ' + e.kw.join(' ')).toLowerCase().includes(q);
      });
    }
    function paResultsHTML() {
      const list = paFiltered();
      if (!list.length) return `<div class="card" style="text-align:center;padding:34px">

      return `<p style="font-size:13.5px;color:var(--muted);margin:0 2px 10px">${fmt('pa_count', { n: list.length })}</p>
 <div class="grid3">${list.map(e => {
        const ei = EVIDENCE.indexOf(e);

 </div>`;

 <div class="notice n-warn">${ic('alert')}<span><b>${t('pa_disc')}</b></span></div>
 <div class="card sec-gap">
   <div class="pa-tools">
     <div class="pa-search">${ic('search')}
       <input class="inp" data-input="pa-q" value="${esc(state.priorQ)}" placeholder="${t('pa_search_ph')}" aria-label="${t('pa_h1')}"/></div>

     ${filters.map(f => `<button class="chip" data-action="pf" data-f="${f[0]}" style="${state.priorF === f[0] ? 'background:var(--navy);color:#fff;border-color:var(--navy)' : ''}">${f[1]}</button>`).join('')}

 <div class="card">
   <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
     <div class="ring">
       <svg width="96" height="96"><circle cx="48" cy="48" r="41" fill="none" stroke="var(--line2)" stroke-width="9"/>

   <div style="margin-top:6px">

   </div>
   ${done ? `<div class="notice n-green" style="margin-top:16px">${ic('checkc')}<span><b>${t('comp_done_t')}</b> — ${t('comp_done_d')}</span></div>` : ''}
   <div class="btn-row" style="margin-top:18px">
     <button class="btn ${done ? 'btn-g' : 'btn-p'}" data-action="open-hf">${ic('user')}${t('comp_review')}</button>
     <button class="btn btn-s" data-action="comp-reset">${ic('refresh')}${t('comp_reset')}</button>
     ${!done ? `<span class="b b-warn">${fmt('pending_n', { n: 6 - c })}</span>` : ''}
   </div>
 </div>`;

    function vSources() {
      return `${pagehead(7, t('src_h1'), t('src_sub'))}
 <div class="notice n-blue">${ic('info')}<span>${t('src_note_t')}</span></div>
 <div class="grid3 sec-gap">
 ${SOURCES.map((s, i) => `
   <div class="src-card">
     <div class="src-top">
       <span class="src-ic ${s.ty}">${ic(s.ic, 'lg')}</span>

     </div>
     <p>${L(s.d)}</p>
     <div class="chiprow">${L(s.c).map(x => `<span class="chip">${x}</span>`).join('')}</div>
     <button class="btn btn-o" style="width:100%" data-action="src" data-i="${i}">${ic('ext')}${t('src_btn')}</button>
   </div>`).join('')}
 </div>`;

    const HF_CATS = CATS.concat([{ en: t('cat_other'), hi: t('cat_other') }]);
    function hfFormHTML() {
      const pend = 6 - compCount();
      return `<form data-form="hf">
   <div class="field"><label class="lbl" for="hf-name">${t('f_name')} *</label>
     <input class="inp" id="hf-name" name="name" placeholder="${t('f_name_ph')}"/></div>
   <div class="field"><label class="lbl" for="hf-q">${t('f_query')} *</label>
     <textarea class="inp txa" id="hf-q" name="query">${esc(state.query)}</textarea></div>
   <div class="field"><label class="lbl" for="hf-cat">${t('f_cat')}</label>
     <select class="inp" id="hf-cat" name="cat">${HF_CATS.map(c => `<option>${L(c)}</option>`).join('')}</select></div>
   <div class="btn-row">
     <button class="btn btn-p" type="submit">${ic('send')}${t('f_submit')}</button>
   </div>
 </form>`;

    function vFacilitator() {
      return `${pagehead(8, t('hf_h1'), t('hf_sub'))}
 <div class="grid2" style="align-items:start">
   <div class="card">
     <div class="card-t">${ic('user')}${t('hf_role_t')}</div>
     <p style="font-size:14.5px;color:var(--muted)">${t('hf_role_d')}</p>
     <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)">

 </div>
 <div class="card sec-gap">
   <div class="card-t">${ic('doc')}${t('hf_list')}<span class="b " style="margin-left:auto"> DATA</span></div>
   ${state.subs.length ? state.subs.map((s, i) => `
     <div class="hf-item">
       <span class="nstep" style="width:30px;height:30px;font-size:12px">${i + 1}</span>
       <div style="flex:1"><h4>${esc(s.name)} · <span style="color:var(--muted);font-weight:500">${esc(s.cat)}</span></h4>

       </div>
     </div>`).join('')
          : `<p style="color:var(--muted);padding:10px 2px">${t('hf_none')}</p>`}

 </div>`;

    /* ============ render & routing ============ */
    const VIEWS = { dashboard: vDash, ask: vAsk, classify: vClassify, pathway: vPathway, 'prior-art': vPriorArt, compliance: vCompliance, sources: vSources, facilitator: vFacilitator };
    function render() {
      renderHeader(); renderSide(); renderFooter();
      $('#view').innerHTML = VIEWS[state.route]();
      document.title = 'IP-SAKTI Sahayak — ' + t('nav_' + ({ dashboard: 'dash', ask: 'ask', classify: 'class', pathway: 'ip', 'prior-art': 'pa', compliance: 'comp', sources: 'src', facilitator: 'hf' }[state.route]));
      window.scrollTo({ top: 0 });
    }
    function onRoute() {
      const h = (location.hash || '#/').replace('#/', '');
      const r = Object.keys(HASH).find(k => HASH[k] === '#/' + h) || 'dashboard';
      state.route = r; render();
    }
    function go(r) {
      if (location.hash === HASH[r]) { render(); return }
      location.hash = HASH[r];
    }

    /* ============ modal & toast ============ */
    function openModal(html) { $('#modal-root').innerHTML = `<div class="modal-ov" data-action="ov-close"><div class="modal">${html}</div></div>` }
    function closeModal() { $('#modal-root').innerHTML = '' }
    function toast(msg, icn = 'checkc') {
      const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `${ic(icn)}<span>${msg}</span>`;
      $('#toast-root').appendChild(el); setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320) }, 3400);
    }

    /* ============ interactions ============ */
    function runAsk() {
      if (state.thinking) return;
      state.thinking = true; render();
      setTimeout(() => { state.thinking = false; if (state.route === 'ask') { state.answered = true; render() } }, 950);
    }
    function handleHfSubmit(form) {
      const name = form.name.value.trim(), q = form.query.value.trim();
      if (!name || !q) { toast(t('hf_err'), 'alert'); return }
      const n = String(state.subs.length + 1).padStart(3, '0');
      state.subs.unshift({
        id: 'HF-' + n, name, cat: form.cat.value, query: q,
        date: new Date().toLocaleDateString(state.lang === 'hi' ? 'hi-IN' : 'en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
      });
      save('subs', state.subs); closeModal(); go('facilitator'); toast(t('hf_ok'));
    }

    document.addEventListener('click', e => {
      const el = e.target.closest('[data-action]'); if (!el) return;
      const a = el.dataset.action;
      if (a === 'nav') go(el.dataset.route);
      else if (a === 'lang') { state.lang = el.dataset.l; save('lang', state.lang); document.documentElement.lang = state.lang; render(); toast(state.lang === 'hi' ? 'भाषा: हिन्दी' : 'Language: English', 'globe') }
      else if (a === 'juris') { state.juris = el.dataset.j; save('juris', state.juris); render() }
      else if (a === 'reset') {
        openModal(`<div class="modal-h"><h3>${t('confirm_reset_t')}</h3><button class="btn btn-s" data-action="modal-close">${ic('x')}</button></div>
   <div class="modal-b"><p>${t('confirm_reset_d')}</p></div>
   <div class="modal-f"><button class="btn btn-s" data-action="modal-close">${t('cancel')}</button>
   <button class="btn btn-p" data-action="confirm-reset" style="background:var(--saffron)">${t('confirm')}</button></div>`);
      }
      else if (a === 'confirm-reset') {
        ['lang', 'juris', 'query', 'cls', 'comp', 'subs'].forEach(k => localStorage.removeItem('ipsakti_' + k));
        state.lang = 'en'; state.juris = 'india'; state.query = SAMPLE_Q.en; state.cls = { step: 0, a: {}, done: false };
        state.comp = { c1: false, c2: false, c3: false, c4: false, c5: false, c6: false }; state.subs = [];
        closeModal(); go('dashboard'); toast(t('reset_ok'));
      }
      else if (a === 'ask-reset') { state.query = SAMPLE_Q.en; state.answered = false; save('query', state.query); render() }
      else if (a === 'ask-run') { runAsk() }
      else if (a === 'cq') {
        state.cls.a[el.dataset.q] = el.dataset.v;
        if (state.cls.step >= 5) { state.cls.done = true; state.cls.step = 6 }
        else state.cls.step++;
        save('cls', state.cls); render();
      }
      else if (a === 'cback') { if (state.cls.step > 0) { state.cls.step--; state.cls.done = false; save('cls', state.cls); render() } }
      else if (a === 'crestart') { state.cls = { step: 0, a: {}, done: false }; save('cls', state.cls); render() }
      else if (a === 'pw') { state.pw = el.dataset.id; render() }
      else if (a === 'pw-prev' || a === 'pw-next') {
        let i = PATHWAYS.findIndex(p => p.id === state.pw);
        i = a === 'pw-prev' ? (i - 1 + PATHWAYS.length) % PATHWAYS.length : (i + 1) % PATHWAYS.length;
        state.pw = PATHWAYS[i].id; render();
      }
      else if (a === 'pf') { state.priorF = el.dataset.f; render() }
      else if (a === 'pa-clear') { state.priorQ = ''; render() }
      else if (a === 'pa') { openEvidenceModal(+el.dataset.i) }
      else if (a === 'ct') {
        const k = el.dataset.i; state.comp[k] = !state.comp[k]; save('comp', state.comp); render();
      }
      else if (a === 'comp-reset') { state.comp = { c1: false, c2: false, c3: false, c4: false, c5: false, c6: false }; save('comp', state.comp); render() }
      else if (a === 'open-hf') {
        const pend = 6 - compCount();
        openModal(`<div class="modal-h"><h3>${t('comp_review')}</h3><button class="btn btn-s" data-action="modal-close">${ic('x')}</button></div>
   <div class="modal-b">
     <div class="notice ${pend ? 'n-warn' : 'n-green'}" style="margin-bottom:16px">${ic(pend ? 'alert' : 'checkc')}<span>${pend ? fmt('hf_pending_note', { n: pend }) : t('hf_all_ok')}</span></div>
     ${hfFormHTML()}
   </div>`);
      }
      else if (a === 'src') { toast(t('src_toast'), 'info') }
      else if (a === 'hf-clear') { state.subs = []; save('subs', state.subs); render() }
      else if (a === 'modal-close') closeModal();
      else if (a === 'ov-close') { if (e.target === el) closeModal() }
    });

    document.addEventListener('submit', e => {
      const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
      if (f.dataset.form === 'hero-ask') {
        const v = f.q.value.trim(); state.query = v || SAMPLE_Q[state.lang]; save('query', state.query);
        state.answered = false; go('ask'); setTimeout(runAsk, 60);
      }
      else if (f.dataset.form === 'ask-run') {
        const v = f.q.value.trim(); state.query = v || SAMPLE_Q[state.lang]; save('query', state.query); runAsk();
      }
      else if (f.dataset.form === 'hf') { handleHfSubmit(f) }
    });

    document.addEventListener('input', e => {
      if (e.target.matches('[data-input="ask-q"]')) { state.query = e.target.value; save('query', state.query) }
      if (e.target.matches('[data-input="pa-q"]')) {
        state.priorQ = e.target.value;
        const box = $('#pa-results'); if (box) box.innerHTML = paResultsHTML();
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      if (e.key === ' ' && e.target.closest('.ck-row')) { e.preventDefault(); e.target.closest('.ck-row').click() }
    });

    /* rotating hero placeholder (subtle, only on dashboard) */
    let phI = 0;
    setInterval(() => {
      const inp = document.querySelector('[data-ph-rot]'); if (!inp) return;
      const phs = JSON.parse(inp.dataset.phs || '[]'); if (!phs.length) return;
      phI = (phI + 1) % phs.length; if (document.activeElement !== inp && !inp.value) inp.placeholder = phs[phI];
    }, 3200);

    document.documentElement.lang = state.lang;
    window.addEventListener('hashchange', onRoute);
    onRoute();
  </script>
</body>

</html>
